name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: brew audit
    runs-on: macos-14
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detects this repo is a tap (owner/homebrew-*), symlinks it into
      # Homebrew's Taps directory and runs `brew trust` on it.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Style
        run: brew style --cask cubiclauncher

      - name: Audit
        run: brew audit --cask cubiclauncher

      - name: Livecheck
        run: brew livecheck --cask cubiclauncher

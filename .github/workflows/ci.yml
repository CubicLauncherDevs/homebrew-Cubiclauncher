name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: brew audit
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Register this repository as a tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/cubiclauncherdevs/homebrew-cubiclauncher"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Style
        run: brew style --cask cubiclauncher

      - name: Audit
        run: brew audit --cask cubiclauncher

      - name: Livecheck
        run: brew livecheck --cask cubiclauncher
